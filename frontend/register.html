<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Smart Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Advanced Register Page Styling */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    .register-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, #f4f2fb 0%, #edf0f7 100%);
      position: relative;
      overflow: hidden;
    }

    .register-wrapper::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -50%;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(124,58,237,0.08) 1px, transparent 1px);
      background-size: 50px 50px;
      animation: float 20s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(20px); }
    }

    .nav {
      position: relative;
      z-index: 10;
      background: linear-gradient(90deg, #1e0830 0%, #3f005e 45%, #24063c 100%);
      backdrop-filter: blur(10px);
      border-bottom: none;
      box-shadow: 0 10px 30px rgba(52, 0, 74, 0.28);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav span {
      color: white;
      font-weight: 700;
      font-size: 18px;
    }

    .nav div a {
      color: rgba(255,255,255,0.9);
      text-decoration: none;
      margin-left: 25px;
      transition: color 0.3s ease;
      font-weight: 500;
    }

    .nav div a:hover {
      color: white;
    }

    .register-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      z-index: 5;
    }

    .register-card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 45px rgba(46, 24, 86, 0.12);
      border: 1px solid rgba(93, 77, 142, 0.16);
      width: 100%;
      max-width: 500px;
      padding: 50px 40px;
      animation: slideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .register-header {
      text-align: center;
      margin-bottom: 35px;
    }

    .register-header h1 {
      color: #2d3748;
      font-size: 28px;
      margin: 0 0 10px 0;
      font-weight: 700;
    }

    .register-header p {
      color: #718096;
      margin: 0;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 22px;
      animation: fadeIn 0.6s ease forwards;
      opacity: 0;
    }

    .form-group:nth-child(1) { animation-delay: 0.1s; }
    .form-group:nth-child(2) { animation-delay: 0.2s; }
    .form-group:nth-child(3) { animation-delay: 0.3s; }
    .form-group:nth-child(4) { animation-delay: 0.4s; }
    .form-group:nth-child(5) { animation-delay: 0.5s; }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .form-group label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-weight: 600;
      color: #2d3748;
      font-size: 14px;
    }

    .form-group .field-hint {
      font-size: 12px;
      color: #a0aec0;
      font-weight: 400;
    }

    .input-wrapper {
      position: relative;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 14px;
      transition: all 0.3s ease;
      background: #f7fafc;
      color: #2d3748;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .form-group input:focus {
      outline: none;
      border-color: #7c3aed;
      background: white;
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.12);
    }

    .form-group input::placeholder {
      color: #cbd5e0;
    }

    .password-strength {
      height: 4px;
      background: #e2e8f0;
      border-radius: 2px;
      margin-top: 6px;
      overflow: hidden;
      display: none;
    }

    .password-strength.show {
      display: block;
    }

    .password-strength-bar {
      height: 100%;
      width: 0%;
      transition: all 0.3s ease;
      background: #cbd5e0;
    }

    .password-strength.weak .password-strength-bar {
      width: 33%;
      background: #fc8181;
    }

    .password-strength.medium .password-strength-bar {
      width: 66%;
      background: #f6ad55;
    }

    .password-strength.strong .password-strength-bar {
      width: 100%;
      background: #48bb78;
    }

    .strength-text {
      font-size: 11px;
      margin-top: 4px;
      color: #a0aec0;
    }

    .strength-text.weak { color: #c53030; }
    .strength-text.medium { color: #c05621; }
    .strength-text.strong { color: #22543d; }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #a0aec0;
      font-size: 18px;
      transition: all 0.3s ease;
      padding: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .password-toggle:hover {
      color: #7c3aed;
    }

    .form-checkbox {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 25px;
    }

    .checkbox-input {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #7c3aed;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .checkbox-input + label {
      cursor: pointer;
      font-size: 13px;
      color: #4a5568;
      user-select: none;
      flex: 1;
      margin: 0;
      font-weight: 400;
      line-height: 1.4;
    }

    .checkbox-input + label a {
      color: #7c3aed;
      text-decoration: none;
      font-weight: 600;
    }

    .checkbox-input + label a:hover {
      text-decoration: underline;
    }

    .error-message {
      background: #fed7d7;
      color: #c53030;
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 14px;
      border-left: 4px solid #fc8181;
      display: none;
      animation: shake 0.4s ease;
    }

    .error-message.show {
      display: block;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .field-error {
      color: #c53030;
      font-size: 12px;
      margin-top: 4px;
      display: none;
    }

    .field-error.show {
      display: block;
    }

    .success-message {
      background: #c6f6d5;
      color: #22543d;
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 14px;
      border-left: 4px solid #9ae6b4;
      display: none;
    }

    .success-message.show {
      display: block;
    }

    .register-btn {
      width: 100%;
      padding: 14px 24px;
      background: linear-gradient(135deg, #7c3aed 0%, #a21caf 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      margin-bottom: 15px;
    }

    .register-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(124, 58, 237, 0.35);
    }

    .register-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .register-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .register-btn.loading::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 16px;
      height: 16px;
      margin: -8px 0 0 -8px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .register-btn.loading span {
      opacity: 0;
    }

    .footer-text {
      text-align: center;
      color: #718096;
      font-size: 14px;
      margin-top: 20px;
    }

    .login-link {
      color: #7c3aed;
      font-weight: 600;
      text-decoration: none;
    }

    .login-link:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .register-card {
        padding: 40px 25px;
      }

      .register-header h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>

  <div class="register-wrapper">
    <div class="nav">
      <span>🤖 Smart Expense Tracker</span>
      <div>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
      </div>
    </div>

    <div class="register-container">
      <div class="register-card">
        <div class="register-header">
          <h1>Create Account</h1>
          <p>Join thousands tracking their finances with AI insights</p>
        </div>

        <div class="success-message" id="successMsg"></div>
        <div class="error-message" id="errorMsg"></div>

        <form id="registerForm" onsubmit="handleRegister(event)">
          <!-- Name Field -->
          <div class="form-group">
            <label for="name">
              Full Name
              <span class="field-hint">Required</span>
            </label>
            <input
              type="text"
              id="name"
              placeholder="John Doe"
              autocomplete="name"
              required
              aria-label="Full name"
            >
            <div class="field-error" id="nameError"></div>
          </div>

          <!-- Email Field -->
          <div class="form-group">
            <label for="email">
              Email Address
              <span class="field-hint">Required</span>
            </label>
            <input
              type="email"
              id="email"
              placeholder="name@example.com"
              autocomplete="email"
              required
              aria-label="Email address"
            >
            <div class="field-error" id="emailError"></div>
          </div>

          <!-- Password Field -->
          <div class="form-group">
            <label for="password">
              Password
              <span class="field-hint" id="strengthLabel">Min 6 characters</span>
            </label>
            <div class="input-wrapper">
              <input
                type="password"
                id="password"
                placeholder="••••••••"
                autocomplete="new-password"
                required
                minlength="6"
                aria-label="Password"
              >
              <button
                type="button"
                class="password-toggle"
                onclick="togglePassword('password')"
                aria-label="Toggle password visibility"
              >👁️</button>
            </div>
            <div class="password-strength" id="passwordStrength">
              <div class="password-strength-bar"></div>
            </div>
            <div class="strength-text" id="strengthText"></div>
            <div class="field-error" id="passwordError"></div>
          </div>

          <!-- Confirm Password -->
          <div class="form-group">
            <label for="confirmPassword">
              Confirm Password
              <span class="field-hint">Required</span>
            </label>
            <div class="input-wrapper">
              <input
                type="password"
                id="confirmPassword"
                placeholder="••••••••"
                autocomplete="new-password"
                required
                minlength="6"
                aria-label="Confirm password"
              >
              <button
                type="button"
                class="password-toggle"
                onclick="togglePassword('confirmPassword')"
                aria-label="Toggle confirm password visibility"
              >👁️</button>
            </div>
            <div class="field-error" id="confirmPasswordError"></div>
          </div>

          <!-- Terms & Conditions -->
          <div class="form-checkbox">
            <input
              type="checkbox"
              id="termsAccepted"
              class="checkbox-input"
              required
              aria-label="Accept terms and conditions"
            >
            <label for="termsAccepted">
              I agree to the <a href="#" onclick="event.preventDefault(); alert('Terms & Conditions would open here')">Terms & Conditions</a> and <a href="#" onclick="event.preventDefault(); alert('Privacy Policy would open here')">Privacy Policy</a>
            </label>
          </div>

          <!-- Register Button -->
          <button type="submit" class="register-btn" id="registerBtn" aria-label="Create account">
            <span>Create Account</span>
          </button>
        </form>

        <div class="footer-text">
          Already have an account?
          <a href="login.html" class="login-link">Sign in here</a>
        </div>
      </div>
    </div>
  </div>

  <script src="common.js"></script>
  <script>
    // Advanced Registration Manager
    class RegisterManager {
      constructor() {
        this.isLoading = false;
        this.setupEventListeners();
      }

      setupEventListeners() {
        const name = document.getElementById('name');
        const email = document.getElementById('email');
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirmPassword');

        // Real-time validation
        name.addEventListener('blur', () => this.validateName());
        email.addEventListener('blur', () => this.validateEmail());
        password.addEventListener('input', () => this.updatePasswordStrength());
        password.addEventListener('blur', () => this.validatePassword());
        confirmPassword.addEventListener('blur', () => this.validatecccPassword());

        // Clear errors on focus
        name.addEventListener('focus', () => this.clearFieldError('name'));
        email.addEventListener('focus', () => this.clearFieldError('email'));
        password.addEventListener('focus', () => this.clearFieldError('password'));
        confirmPassword.addEventListener('focus', () => this.clearFieldError('confirmPassword'));
      }

      validateName() {
        const name = document.getElementById('name').value.trim();

        if (!name) {
          this.showFieldError('name', 'Full name is required');
          return false;
        }

        if (name.length < 2) {
          this.showFieldError('name', 'Name must be at least 2 characters');
          return false;
        }

        if (!/^[a-zA-Z\s'-]+$/.test(name)) {
          this.showFieldError('name', 'Name can only contain letters, spaces, hyphens, and apostrophes');
          return false;
        }

        this.clearFieldError('name');
        return true;
      }

      validateEmail() {
        const email = document.getElementById('email').value;
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (!email) {
          this.showFieldError('email', 'Email is required');
          return false;
        }

        if (!emailRegex.test(email)) {
          this.showFieldError('email', 'Please enter a valid email address');
          return false;
        }

        this.clearFieldError('email');
        return true;
      }

      validatePassword() {
        const password = document.getElementById('password').value;

        if (!password) {
          this.showFieldError('password', 'Password is required');
          return false;
        }

        if (password.length < 6) {
          this.showFieldError('password', 'Password must be at least 6 characters');
          return false;
        }

        this.clearFieldError('password');
        return true;
      }

      validatecccPassword() {
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (!confirmPassword) {
          this.showFieldError('confirmPassword', 'Please confirm your password');
          return false;
        }

        if (password !== confirmPassword) {
          this.showFieldError('confirmPassword', 'Passwords do not match');
          return false;
        }

        this.clearFieldError('confirmPassword');
        return true;
      }

      updatePasswordStrength() {
        const password = document.getElementById('password').value;
        const strengthDiv = document.getElementById('passwordStrength');
        const strengthText = document.getElementById('strengthText');
        const strengthLabel = document.getElementById('strengthLabel');

        if (!password) {
          strengthDiv.classList.remove('show', 'weak', 'medium', 'strong');
          strengthText.textContent = '';
          return;
        }

        strengthDiv.classList.add('show');

        // Calculate strength
        let strength = 0;
        if (password.length >= 6) strength++;
        if (password.length >= 8) strength++;
        if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength++;
        if (password.match(/[0-9]/)) strength++;
        if (password.match(/[^a-zA-Z0-9]/)) strength++;

        let level = 'weak';
        if (strength >= 4) level = 'strong';
        else if (strength >= 2) level = 'medium';

        strengthDiv.className = `password-strength show ${level}`;

        const texts = {
          weak: 'Weak - Add uppercase, numbers, or symbols',
          medium: 'Medium - Good, but add more complexity',
          strong: 'Strong - Great password!'
        };

        strengthText.textContent = texts[level];
        strengthText.className = `strength-text ${level}`;
      }

      showFieldError(field, message) {
        const errorDiv = document.getElementById(`${field}Error`);
        if (errorDiv) {
          errorDiv.textContent = message;
          errorDiv.classList.add('show');
        }
      }

      clearFieldError(field) {
        const errorDiv = document.getElementById(`${field}Error`);
        if (errorDiv) {
          errorDiv.textContent = '';
          errorDiv.classList.remove('show');
        }
      }

      showError(message) {
        const errorDiv = document.getElementById('errorMsg');
        errorDiv.textContent = message;
        errorDiv.classList.add('show');
      }

      showSuccess(message) {
        const successDiv = document.getElementById('successMsg');
        successDiv.textContent = message;
        successDiv.classList.add('show');
      }

      setLoading(loading) {
        this.isLoading = loading;
        const btn = document.getElementById('registerBtn');
        const form = document.getElementById('registerForm');

        if (loading) {
          btn.classList.add('loading');
          btn.disabled = true;
          form.style.opacity = '0.6';
          form.style.pointerEvents = 'none';
        } else {
          btn.classList.remove('loading');
          btn.disabled = false;
          form.style.opacity = '1';
          form.style.pointerEvents = 'auto';
        }
      }

      validateForm() {
        const termsAccepted = document.getElementById('termsAccepted').checked;

        if (!this.validateName() || !this.validateEmail() || !this.validatePassword() || !this.validatecccPassword()) {
          return false;
        }

        if (!termsAccepted) {
          this.showError('You must accept the Terms & Conditions');
          return false;
        }

        return true;
      }

      async handleRegister(e) {
        e.preventDefault();

        if (!this.validateForm()) {
          return;
        }

        this.setLoading(true);

        try {
          const name = document.getElementById('name').value;
          const email = document.getElementById('email').value;
          const password = document.getElementById('password').value;

          const res = await apiFetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, password })
          });

          const data = await res.json();

          if (data.message) {
            this.showSuccess('✓ Account created successfully! Redirecting to login...');

            setTimeout(() => {
              window.location.href = 'login.html';
            }, 2000);
          } else {
            this.showError(data.error || 'Registration failed. Please try again.');
          }
        } catch (error) {
          this.showError('Network error. Please check your connection.');
          console.error('Registration error:', error);
        } finally {
          this.setLoading(false);
        }
      }
    }

    // Global Functions
    function togglePassword(fieldId) {
      const field = document.getElementById(fieldId);
      const toggle = event.target;

      if (field.type === 'password') {
        field.type = 'text';
        toggle.textContent = '👁️‍🗨️';
      } else {
        field.type = 'password';
        toggle.textContent = '👁️';
      }
    }

    function handleRegister(e) {
      registerManager.handleRegister(e);
    }

    // Initialize on page load
    let registerManager;
    document.addEventListener('DOMContentLoaded', () => {
      registerManager = new RegisterManager();
    });
  </script>

</body>
</html>
