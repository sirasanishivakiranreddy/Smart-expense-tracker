<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget - SmartExpense Tracker</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      background: linear-gradient(180deg, #f4f2fb 0%, #edf0f7 100%);
      min-height: 100vh;
    }

    .nav {
      background: linear-gradient(90deg, #1e0830 0%, #3f005e 45%, #24063c 100%);
      border: none;
      box-shadow: 0 10px 30px rgba(52, 0, 74, 0.28);
    }

    .nav-title,
    .nav-link {
      color: #fff;
    }

    .nav-link:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
    }

    .theme-toggle {
      border-color: rgba(255, 255, 255, 0.28);
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
    }

    .container {
      padding-top: 2rem;
      padding-bottom: 3rem;
    }

    .card {
      border-radius: 24px;
      border: 1px solid rgba(93, 77, 142, 0.16);
      box-shadow: 0 20px 45px rgba(46, 24, 86, 0.1);
      background: rgba(255, 255, 255, 0.95);
    }
  </style>
</head>
<body>

  <nav class="nav">
    <div class="nav-title">Smart Expense Tracker</div>
    <div class="nav-links">
      <a href="dashboard.html" class="nav-link">Dashboard</a>
      <a href="add-expense.html" class="nav-link">Add Expense</a>
      <a href="income.html" class="nav-link">Income</a>
      <a href="recurring.html" class="nav-link">Recurring</a>
      <a href="budget.html" class="nav-link">Budget</a>
      <button onclick="toggleDarkMode()" class="theme-toggle">🌙</button>
      <a href="#" onclick="logout()" class="nav-link btn btn--outline btn--small">Logout</a>
    </div>
  </nav>

  <main class="container">
    <header class="text-center mb-xl">
      <h1>Budget Management</h1>
      <p class="text-secondary max-w-md mx-auto">Set monthly spending limits by category and stay on track</p>
    </header>

    <div class="card">
      <h2 class="mb-lg">➕ Set New Budget</h2>
      <form class="grid-2 gap-lg max-w-md">
        <div class="form-group">
          <label class="form-label" for="category">Category</label>
          <select id="category" class="form-select" required>
            <option value="">Select category</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="monthly_limit">Monthly Limit (₹)</label>
          <input type="number" id="monthly_limit" class="form-input" min="0" step="0.01" placeholder="5000" required>
        </div>
        <div class="message--error" id="error"></div>
        <div class="message--success" id="success"></div>
        <button type="button" onclick="setBudget()" class="btn btn--primary full-width col-span-2">Set Budget Limit</button>
      </form>
    </div>

    <div class="card">
      <h2 class="mb-md">Your Active Budgets</h2>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Category</th>
              <th>Monthly Limit</th>
              <th>Spent</th>
              <th>Remaining</th>
              <th>Progress</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="budgetTable">
            <tr><td colspan="6" class="text-center py-lg text-secondary">Loading budgets...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="common.js"></script>
  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'login.html';

    populateCategories('category', { includeAll: false });

    async function setBudget() {
      const errorEl = document.getElementById('error');
      const successEl = document.getElementById('success');
      errorEl.textContent = '';
      successEl.textContent = '';

      const category = document.getElementById('category').value;
      const monthly_limit = parseFloat(document.getElementById('monthly_limit').value);

      if (!category || isNaN(monthly_limit) || monthly_limit <= 0) {
        errorEl.textContent = 'Please select a category and enter valid limit';
        return;
      }

      try {
        const res = await apiFetch('/api/expenses/budget', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ category, monthly_limit })
        });

        const data = await res.json();

        if (res.ok) {
          successEl.textContent = '✅ Budget set successfully!';
          document.getElementById('category').value = '';
          document.getElementById('monthly_limit').value = '';
          loadBudgets();
        } else {
          errorEl.textContent = data.error || 'Failed to set budget';
        }
      } catch (err) {
        errorEl.textContent = 'Network error';
      }
    }

    async function loadBudgets() {
      try {
        const res = await apiFetch('/api/expenses/budget', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const budgets = await res.json();

        const tbody = document.getElementById('budgetTable');
        if (!Array.isArray(budgets) || !budgets.length) {
          tbody.innerHTML = '<tr><td colspan="6" class="text-center py-lg text-secondary">No budgets set. Add one above!</td></tr>';
          return;
        }

        tbody.innerHTML = budgets.map(b => {
          const monthlyLimit = Number(b.monthly_limit) || 0;
          const spent = Number(b.spent) || 0;
          const remaining = Number.isFinite(Number(b.remaining))
            ? Number(b.remaining)
            : monthlyLimit - spent;
          const percent = monthlyLimit > 0 ? ((spent / monthlyLimit) * 100).toFixed(1) : '0.0';
          const status = percent > 100 ? 'over' : percent > 80 ? 'warning' : 'good';
          return `
            <tr>
              <td>${b.category}</td>
              <td>₹${monthlyLimit.toLocaleString()}</td>
              <td>₹${spent.toLocaleString()}</td>
              <td class="${status === 'over' ? 'text-danger' : ''}">₹${remaining.toLocaleString()}</td>
              <td>
                <div class="w-full bg-gray-200 rounded-full h-2">
                  <div class="bg-${status} h-2 rounded-full" style="width: ${Math.min(percent, 100)}%"></div>
                </div>
                <small class="text-secondary">${percent}%</small>
              </td>
              <td><button onclick="deleteBudget('${b.id}')" class="btn btn--danger btn--small">Delete</button></td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        document.getElementById('budgetTable').innerHTML = '<tr><td colspan="6" class="text-center text-danger">Error loading budgets</td></tr>';
      }
    }

    async function deleteBudget(id) {
      if (!confirm('Delete this budget?')) return;
      try {
        await apiFetch(`/api/expenses/budget/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
        loadBudgets();
      } catch (err) {
        alert('Delete failed');
      }
    }

    loadBudgets();

    // Auth & Theme
    function logout() {
      localStorage.clear();
      window.location.href = 'login.html';
    }

    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
      localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
    }

    if (localStorage.getItem('darkMode') === 'true') {
      document.body.classList.add('dark-mode');
    }
  </script>
</body>
</html>
