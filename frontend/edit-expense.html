<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Expense - SmartExpense Tracker</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      background: linear-gradient(180deg, #f4f2fb 0%, #edf0f7 100%);
      min-height: 100vh;
    }

    .nav {
      background: linear-gradient(90deg, #1e0830 0%, #3f005e 45%, #24063c 100%);
      border: none;
      box-shadow: 0 10px 30px rgba(52, 0, 74, 0.28);
    }

    .nav-title,
    .nav-link {
      color: #fff;
    }

    .nav-link:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
    }

    .theme-toggle {
      border-color: rgba(255, 255, 255, 0.28);
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
    }

    .container {
      padding-top: 2rem;
      padding-bottom: 3rem;
    }

    .card {
      border-radius: 24px;
      border: 1px solid rgba(93, 77, 142, 0.16);
      box-shadow: 0 20px 45px rgba(46, 24, 86, 0.1);
      background: rgba(255, 255, 255, 0.95);
    }
  </style>
</head>
<body>

  <nav class="nav">
    <div class="nav-title">Smart Expense Tracker</div>
    <div class="nav-links">
      <a href="dashboard.html" class="nav-link">Dashboard</a>
      <a href="add-expense.html" class="nav-link">Add Expense</a>
      <a href="income.html" class="nav-link">Income</a>
      <a href="recurring.html" class="nav-link">Recurring</a>
      <a href="budget.html" class="nav-link">Budget</a>
      <button onclick="toggleDarkMode()" class="theme-toggle" title="Toggle Dark Mode">🌙</button>
      <a href="#" onclick="logout()" class="nav-link btn btn--outline btn--small">Logout</a>
    </div>
  </nav>

  <main class="container">
    <div class="card" style="max-width: 480px; margin: 4rem auto;">
      <header class="text-center mb-lg">
        <h1>Edit Expense</h1>
      </header>

      <form class="form-group">
        <label class="form-label" for="amount">Amount (₹)</label>
        <input type="number" id="amount" class="form-input" placeholder="0.00" min="0" step="0.01" required>

        <label class="form-label" for="category">Category</label>
        <select id="category" class="form-select" required>
          <option value="">Select category</option>
        </select>

        <label class="form-label" for="description">Description</label>
        <input type="text" id="description" class="form-input" placeholder="Update description" required>

        <label class="form-label" for="date">Date</label>
        <input type="date" id="date" class="form-input" required>

        <div class="message--error" id="error" role="alert"></div>
        <div class="message--success" id="success" role="alert"></div>

        <div class="grid-2 gap-md">
          <button type="button" onclick="updateExpense()" class="btn btn--primary full-width">Update Expense</button>
          <a href="dashboard.html" class="btn btn--outline full-width text-center">Cancel</a>
        </div>
      </form>
    </div>
  </main>

  <script src="common.js"></script>
  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'login.html';

    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const category = params.get('category');
    const description = params.get('description');
    const amount = params.get('amount');
    const date = params.get('date');

    function safeDecode(value) {
      if (!value) return '';
      try {
        return decodeURIComponent(value);
      } catch (err) {
        return value;
      }
    }

    async function initPage() {
      await populateCategories('category');
      
      document.getElementById('amount').value = amount || '';
      document.getElementById('description').value = safeDecode(description);
      document.getElementById('date').value = date || '';
      
      // Select category
      const select = document.getElementById('category');
      const selectedOption = Array.from(select.options).find(opt => opt.value === (category || ''));
      if (selectedOption) {
        selectedOption.selected = true;
      }
    }

    initPage().catch(() => {
      document.getElementById('error').textContent = 'Unable to load expense details.';
    });

    async function updateExpense() {
      const errorEl = document.getElementById('error');
      const successEl = document.getElementById('success');
      errorEl.textContent = '';
      successEl.textContent = '';

      const formData = {
        amount: parseFloat(document.getElementById('amount').value),
        category: document.getElementById('category').value,
        description: document.getElementById('description').value.trim(),
        date: document.getElementById('date').value
      };

      if (!id) {
        errorEl.textContent = 'Missing expense ID.';
        return;
      }

      if (isNaN(formData.amount) || formData.amount <= 0 || !formData.category || !formData.description) {
        errorEl.textContent = 'Please fill all fields correctly';
        return;
      }

      try {
        const res = await apiFetch(`/api/expenses/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify(formData)
        });

        const data = await res.json();

        if (res.ok) {
          successEl.textContent = '✅ Expense updated successfully!';
          setTimeout(() => window.location.href = 'dashboard.html', 1500);
        } else {
          errorEl.textContent = data.error || 'Update failed';
        }
      } catch (err) {
        errorEl.textContent = 'Network error. Please try again.';
      }
    }

    // Auth & Theme
    function logout() {
      localStorage.clear();
      window.location.href = 'login.html';
    }

    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
      localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
    }

    if (localStorage.getItem('darkMode') === 'true') {
      document.body.classList.add('dark-mode');
    }
  </script>
</body>
</html>
